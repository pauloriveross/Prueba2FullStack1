server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: corredores
              uri: http://localhost:8091
              predicates:
                - Path=/api/v1/corredores/**
            - id: clientes
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/clientes/**
            - id: mantencion
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/mantenciones/**
            - id: mecanicos
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/mecanicos/**
            - id: personalaseo
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/personalaseo/**
            - id: seguro
              uri: http://localhost:8090
              predicates:
                - Path=/api/v1/seguros/**
            - id: vehiculo
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/vehiculos/**
            - id: vendedor
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/vendedores/**
            - id: ventas-Update
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/ventas/**
            - id: auth-service
              uri: http://localhost:8086
              predicates:
                - Path=/auth/**
            - id: testDrive
              uri: http://localhost:8092
              predicates:
                - Path=/api/v1/testDrive/**


management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8869/eureka/}
  instance:
    prefer-ip-address: true
