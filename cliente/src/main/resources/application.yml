server:
  port: ${PORT:8082}

spring:
  application:
    name: cliente
  profiles:
    active: default
  datasource:
    url: ${DB_URL_PRINCIPAL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db.migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  enable-hateoas: false


logging:
  level:
    duoc.cliente: INFO
    org.springframework.web: WARN
  file:
    name: logs/cliente.log

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8869/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: "ClaveSuperSeguraJWTParaDuocUC2026SpringBoot"
  expiration-ms: 3600000
