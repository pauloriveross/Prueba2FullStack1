server:
  port: ${PORT:8083}

spring:
  application:
    name: ventas-Update
  datasource:
    url: jdbc:h2:mem:db_ventas;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  enable-hateoas: false

logging:
  level:
    duoc.ventas: INFO
    org.springframework.web: WARN
  file:
    name: logs/venta.log

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8869/eureka/}
  instance:
    prefer-ip-address: true
app:
  discovery:
    enabled: ${APP_DISCOVERY_ENABLED:true}

services:
  cliente:
    url: ${CLIENTE_URL:http://CLIENTE}
  vendedor:
    url: ${VENDEDOR_URL:http://VENDEDOR}
  vehiculo:
    url: ${VEHICULO_URL:http://VEHICULO}

jwt:
  secret: "ClaveSuperSeguraJWTParaDuocUC2026SpringBoot"
  expiration-ms: 3600000