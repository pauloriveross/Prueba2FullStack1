services:
  - type: web
    name: automotora-cliente
    runtime: docker
    plan: free
    dockerfilePath: ./render/docker/cliente.Dockerfile
    dockerContext: .
    #healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: PORT
        value: "8082"


  - type: web
    name: automotora-auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./render/docker/auth-service.Dockerfile
    dockerContext: .
    #healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: PORT
        value: "8086"

  - type: web
    name: automotora-corredorseguro
