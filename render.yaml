    #healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: PORT
        value: "8091"

  - type: web
    name: automotora-gateway-service
    runtime: docker
    plan: free
    dockerfilePath: ./render/docker/gateway-service.Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_ENABLED
        value: false
      - key: CLIENTES_URL
        value: https://automotora-cliente.onrender.com
      - key: MECANICOS_URL
        value: https://automotora-mecanicos.onrender.com
      - key: VEHICULO_URL
        value: https://automotora-vehiculo.onrender.com
      - key: CORREDOR_URL
        value: https://automotora-corredorseguro.onrender.com
      - key: VENDEDOR_URL
        value: https://automotora-vendedor.onrender.com
      - key: MANTENCIONES_URL
        value: https://automotora-mantenciones.onrender.com
      - key: PERSONALASEO_URL
        value: https://automotora-personal-aseo.onrender.com
      - key: SEGURO_URL
        value: https://automotora-seguro.onrender.com
      - key: VENTAS_UPDATE_URL
        value: https://automotora-ventas-update.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://automotora-auth-service.onrender.com
      - key: TEST_DRIVE_URL
        value: https://automotora-testdrive.onrender.com

  - type: web
    name: automotora-mantenciones
