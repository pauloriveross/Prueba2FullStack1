server:
  port: ${PORT:8091}
spring:
  application:
    name: corredorSeguro
  datasource:
    url: jdbc:h2:mem:dv_corredor;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  enable-hateoas: false


logging:
  level:
    duoc.corredorSeguro: info
    org.springframework.web: warn
  file:
    name: logs/corredor.log


