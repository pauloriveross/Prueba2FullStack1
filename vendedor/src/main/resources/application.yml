server:
  port: ${PORT:8081}

spring:
  application:
    name: vendedor
  datasource:
    url: jdbc:h2:mem:db_vendedor;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true


  h2:
    console:
    enabled: true
    path: /h2-console


  springdoc:
    swagger-ui:
      path: /swagger-ui.html


logging:
  level:
    root: INFO
    duoc:
      vendedor: INFO
  file:
    name: logs/vendedor.log

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8869/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: "ClaveSuperSeguraJWTParaDuocUC2026SpringBoot"
  expiration-ms: 3600000


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  enable-hateoas: false
